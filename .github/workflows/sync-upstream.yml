name: Sync Upstream Release

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.check.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/clash-verge-rev/clash-verge-rev.git
          git fetch upstream main
          # --force: fork tags (vX.Y.Z, updater) already exist locally; overwriting
          # them in this CI workspace is safe (they are never pushed back).
          # Without --force, git exits non-zero on clobbered tags and kills the job.
          git fetch upstream --tags --force

      - name: Find new upstream tag
        id: check
        run: |
          echo "Fetching tags from origin and upstream..."

          # Get all tags from origin and upstream.
          # Filter out dereferenced annotated-tag entries (refs/tags/X^{}) to avoid
          # polluting the comparison.
          origin_tags=$(git tag -l 'v*' --sort=-version:refname)
          upstream_tags=$(git ls-remote --tags upstream 'v*' | awk '{print $2}' | sed 's|refs/tags/||' | grep -vF '^{}' | sort -Vr)

          echo "=== Origin tags ==="
          echo "$origin_tags"
          echo "=== Upstream tags ==="
          echo "$upstream_tags"

          # Only compare the LATEST upstream tag. Fork always merges upstream/main
          # (HEAD), so intermediate skipped tags (e.g. a missed v2.5.1) cannot be
          # faithfully rebuilt and are intentionally ignored.
          latest_upstream=$(echo "$upstream_tags" | head -n 1)
          echo "Latest upstream tag: $latest_upstream"

          if [ -n "$latest_upstream" ] && ! echo "$origin_tags" | grep -qx "$latest_upstream"; then
            echo "Found new upstream tag: $latest_upstream"
            echo "new_tag=$latest_upstream" >> $GITHUB_OUTPUT
          else
            echo "No new upstream tags found."
            echo "new_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream main
        if: steps.check.outputs.new_tag != ''
        id: merge
        run: |
          TAG="${{ steps.check.outputs.new_tag }}"
          echo "Merging upstream/main into main for tag $TAG..."

          git checkout main
          git merge upstream/main --no-edit

          if [ $? -ne 0 ]; then
            echo "Merge conflict detected!"
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
          else
            echo "Merge successful."
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Create conflict notification issue
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Merge conflict when syncing upstream tag ${{ steps.check.outputs.new_tag }}`,
              assignees: ['rede97'],
              body: [
                '## Merge Conflict',
                '',
                `Upstream has a new tag **${{ steps.check.outputs.new_tag }}**, but merging \`upstream/main\` into \`main\` resulted in a conflict.`,
                '',
                '### Action required',
                '1. Pull the latest code locally',
                '2. Merge `upstream/main` into `main` manually',
                '3. Resolve conflicts',
                '4. Push the resolved `main` branch',
                '5. Run the sync workflow again or push the tag manually',
                '',
                '### Resolve locally',
                '```bash',
                'git checkout main',
                'git pull origin main',
                'git remote add upstream https://github.com/clash-verge-rev/clash-verge-rev.git',
                'git fetch upstream main',
                'git merge upstream/main',
                '# resolve conflicts, then:',
                'git push origin main',
                'git tag ${{ steps.check.outputs.new_tag }}',
                'git push origin ${{ steps.check.outputs.new_tag }}',
                '```',
                '',
                `Triggered by [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['merge-conflict'],
            });

      - name: Push main branch
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin main

      - name: Create and push release tag
        if: steps.merge.outputs.conflict == 'false'
        run: |
          TAG="${{ steps.check.outputs.new_tag }}"
          # -f: the tag may already exist locally after 'git fetch upstream --tags --force'
          # (pointing at upstream's commit). Retag it on the merged fork main HEAD.
          git tag -f "$TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG - release workflow triggered."

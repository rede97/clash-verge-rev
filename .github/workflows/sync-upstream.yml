name: Sync Upstream Release

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.check.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/clash-verge-rev/clash-verge-rev.git
          git fetch upstream --tags

      - name: Find new upstream tag
        id: check
        run: |
          echo "Fetching tags from origin and upstream..."

          # Get all tags from origin and upstream, compare to find new ones
          origin_tags=$(git tag -l 'v*' --sort=-version:refname)
          upstream_tags=$(git ls-remote --tags upstream 'v*' | awk '{print $2}' | sed 's|refs/tags/||' | sort -Vr)

          echo "=== Origin tags ==="
          echo "$origin_tags"
          echo "=== Upstream tags ==="
          echo "$upstream_tags"

          # Find tags in upstream but not in origin
          for tag in $upstream_tags; do
            if ! echo "$origin_tags" | grep -qx "$tag"; then
              echo "Found new upstream tag: $tag"
              echo "new_tag=$tag" >> $GITHUB_OUTPUT
              break
            fi
          done

          if [ -z "${new_tag:-}" ]; then
            echo "No new upstream tags found."
            echo "new_tag=" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream main
        if: steps.check.outputs.new_tag != ''
        id: merge
        run: |
          TAG="${{ steps.check.outputs.new_tag }}"
          echo "Merging upstream/main into main for tag $TAG..."

          git checkout main
          git merge upstream/main --no-edit

          if [ $? -ne 0 ]; then
            echo "Merge conflict detected!"
            git merge --abort
            echo "conflict=true" >> $GITHUB_OUTPUT
          else
            echo "Merge successful."
            echo "conflict=false" >> $GITHUB_OUTPUT
          fi

      - name: Create conflict notification issue
        if: steps.merge.outputs.conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Merge conflict when syncing upstream tag ${{ steps.check.outputs.new_tag }}`,
              body: [
                '## Merge Conflict',
                '',
                `Upstream has a new tag **${{ steps.check.outputs.new_tag }}**, but merging \`upstream/main\` into \`main\` resulted in a conflict.`,
                '',
                '### Action required',
                '1. Pull the latest code locally',
                '2. Merge `upstream/main` into `main` manually',
                '3. Resolve conflicts',
                '4. Push the resolved `main` branch',
                '5. Run the sync workflow again or push the tag manually',
                '',
                '### Resolve locally',
                '```bash',
                'git checkout main',
                'git pull origin main',
                'git remote add upstream https://github.com/clash-verge-rev/clash-verge-rev.git',
                'git fetch upstream main',
                'git merge upstream/main',
                '# resolve conflicts, then:',
                'git push origin main',
                'git tag ${{ steps.check.outputs.new_tag }}',
                'git push origin ${{ steps.check.outputs.new_tag }}',
                '```',
                '',
                `Triggered by [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              ].join('\n'),
              labels: ['merge-conflict'],
            });

      - name: Push main branch
        if: steps.merge.outputs.conflict == 'false'
        run: |
          git push origin main

      - name: Create and push release tag
        if: steps.merge.outputs.conflict == 'false'
        run: |
          TAG="${{ steps.check.outputs.new_tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          echo "Pushed tag $TAG - release workflow triggered."
